<div class="admin-layout">
  <!-- Dynamic Background Lights -->
  <div class="admin-bg-lights">
    <div class="light-orb orb-1"></div>
    <div class="light-orb orb-2"></div>
  </div>

  <!-- Sidebar Overlay -->
  <div class="sidebar-overlay" *ngIf="isSidebarOpen" (click)="toggleSidebar()"></div>

  <!-- Sidebar -->
  <aside class="admin-sidebar glass" [class.sidebar-open]="isSidebarOpen">
    <div class="sidebar-header">
      <h2 class="logo-text">Realmyfit <span class="text-primary">Admin</span></h2>
    </div>

    <nav class="sidebar-nav">
      <a *ngFor="let item of menuItems" [routerLink]="item.route" routerLinkActive="active" class="nav-item"
        (click)="isSidebarOpen = false">
        <span class="nav-icon" [innerHTML]="item.svg"></span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </nav>


  </aside>

  <!-- Main Content area -->
  <main class="admin-main">
    <header class="admin-top-bar glass">
      <button class="mobile-menu-btn" (click)="toggleSidebar()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <h1 class="page-title">Panel de Control</h1>
      <div class="user-profile" style="position:relative;" (click)="toggleDropdown()">
        <span class="user-name">{{ userName }}</span>
        <div class="user-avatar glass" title="Opciones de perfil" style="position:relative; overflow:hidden;">
          <input #avatarInput type="file" accept="image/png,image/jpeg,image/webp" hidden (change)="onAvatarFileSelected($event)">
          @if (userAvatar) {
            <img [src]="userAvatar" alt="Avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">
          } @else {
            {{ userInitials }}
          }
          @if (isUploadingAvatar) {
            <div style="position:absolute;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;border-radius:50%;">
              <div style="width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
            </div>
          }
        </div>
        
        <!-- Dropdown flotante -->
        <div class="profile-dropdown glass" *ngIf="isDropdownOpen" (click)="$event.stopPropagation()">
          <a class="dropdown-item" routerLink="/" (click)="isDropdownOpen = false">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Volver al Sitio
          </a>
          <button class="dropdown-item" (click)="avatarInput.click(); isDropdownOpen = false">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            Cambiar Foto
          </button>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item text-danger" routerLink="/auth/login" (click)="logout(); isDropdownOpen = false">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            Cerrar sesión
          </button>
        </div>
      </div>
    </header>

    <section class="admin-content">
      <!-- Nested views will go here -->
      <div class="view-container">
        <router-outlet></router-outlet>
      </div>
    </section>
  </main>
</div>

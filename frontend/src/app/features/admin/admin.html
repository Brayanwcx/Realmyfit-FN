<div class="admin-layout">
  <!-- Dynamic Background Lights -->
  <div class="admin-bg-lights">
    <div class="light-orb orb-1"></div>
    <div class="light-orb orb-2"></div>
  </div>

  <!-- Sidebar Overlay -->
  <div class="sidebar-overlay" *ngIf="isSidebarOpen" (click)="toggleSidebar()"></div>

  <!-- Sidebar -->
  <aside class="admin-sidebar glass" [class.sidebar-open]="isSidebarOpen">
    <div class="sidebar-header">
      <h2 class="logo-text">Realmyfit <span class="text-primary">Admin</span></h2>
    </div>

    <nav class="sidebar-nav">
      <a *ngFor="let item of menuItems" [routerLink]="item.route" routerLinkActive="active" class="nav-item"
        (click)="isSidebarOpen = false">
        <span class="nav-icon" [innerHTML]="item.svg"></span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="btn-logout glass" routerLink="/">Volver al Sitio</button>
    </div>
  </aside>

  <!-- Main Content area -->
  <main class="admin-main">
    <header class="admin-top-bar glass">
      <button class="mobile-menu-btn" (click)="toggleSidebar()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <h1 class="page-title">Panel de Control</h1>
      <div class="user-profile">
        <span class="user-name">{{ userName }}</span>
        <div class="user-avatar glass" (click)="avatarInput.click()" title="Cambiar foto de perfil" style="cursor:pointer; position:relative; overflow:hidden;">
          <input #avatarInput type="file" accept="image/png,image/jpeg,image/webp" hidden (change)="onAvatarFileSelected($event)">
          @if (userAvatar) {
            <img [src]="userAvatar" alt="Avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">
          } @else {
            {{ userInitials }}
          }
          @if (isUploadingAvatar) {
            <div style="position:absolute;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;border-radius:50%;">
              <div style="width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
            </div>
          }
        </div>
      </div>
    </header>

    <section class="admin-content">
      <!-- Nested views will go here -->
      <div class="view-container">
        <router-outlet></router-outlet>
      </div>
    </section>
  </main>
</div>

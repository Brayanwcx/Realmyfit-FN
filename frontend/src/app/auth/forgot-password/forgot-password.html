<div class="auth-page">
  <!-- Floating particles background -->
  <div class="particles-container">
    <div class="particle" style="left: 10%; top: 20%; width: 3px; height: 3px; opacity: 0.3; animation-duration: 15s;"></div>
    <div class="particle" style="left: 30%; top: 50%; width: 2px; height: 2px; opacity: 0.2; animation-duration: 20s;"></div>
    <div class="particle" style="left: 70%; top: 30%; width: 4px; height: 4px; opacity: 0.4; animation-duration: 12s;"></div>
    <div class="particle" style="left: 90%; top: 80%; width: 2px; height: 2px; opacity: 0.2; animation-duration: 18s;"></div>
  </div>

  <!-- Glowing grid lines -->
  <div class="grid-bg"></div>

  <div class="auth-shell" style="max-width: 520px;">
    <!-- ====== Form side ====== -->
    <div class="auth-form-side" style="padding: 2.5rem; min-height: 480px; width: 100%;">
      <div class="form-card" style="margin: 0 auto;">
        <!-- Logo -->
        <div class="form-logo" style="justify-content: center; margin-bottom: 2rem;">
          <div class="logo-mark">
            <span>R</span>
          </div>
          <span class="logo-name">RealMyFit</span>
        </div>

        <h2 class="form-heading" style="text-align: center;">
          Recuperar Contraseña
        </h2>
        <p class="form-subheading" style="text-align: center;">
          Ingresa tu correo electrónico y te enviaremos un código para restablecerla.
        </p>

        <!-- Success Alert -->
        <div *ngIf="successMessage" class="error-alert" style="background: rgba(46, 213, 115, 0.08); border-color: rgba(46, 213, 115, 0.2); color: #2ed573;">
          <div class="error-icon-wrap" style="background: rgba(46, 213, 115, 0.15);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <polyline points="20 6 9 17 4 12" />
            </svg>
          </div>
          <span>{{ successMessage }}<br><small>Redirigiendo...</small></span>
        </div>

        <!-- Error Alert -->
        <div *ngIf="errorMessage" class="error-alert">
          <div class="error-icon-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <circle cx="12" cy="12" r="10" />
              <line x1="15" y1="9" x2="9" y2="15" />
              <line x1="9" y1="9" x2="15" y2="15" />
            </svg>
          </div>
          <span>{{ errorMessage }}</span>
          <button class="error-dismiss" (click)="errorMessage = ''">✕</button>
        </div>

        <form (ngSubmit)="onSubmit()" [formGroup]="forgotPasswordForm" class="auth-form" *ngIf="!successMessage">
          <!-- Email -->
          <div class="floating-field">
            <div class="field-inner">
              <input type="email" id="email" formControlName="email" required placeholder=" ">
              <label for="email">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="2" y="4" width="20" height="16" rx="2" />
                  <polyline points="22,6 12,13 2,6" />
                </svg>
                Correo electrónico
              </label>
            </div>
          </div>

          <button type="submit" class="submit-btn" [disabled]="forgotPasswordForm.invalid || loading" [class.loading]="loading" style="margin-top: 1.5rem;">
            <span class="btn-bg"></span>
            <span class="btn-content">
              <span *ngIf="loading" class="btn-spinner"></span>
              {{ loading ? 'Enviando...' : 'Enviar Código' }}
              <svg *ngIf="!loading" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="22" y1="2" x2="11" y2="13" />
                <polygon points="22 2 15 22 11 13 2 9 22 2" />
              </svg>
            </span>
          </button>

          <div class="mode-switch" style="margin-top: 2rem;">
            <button type="button" class="switch-btn" routerLink="/login">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right: 4px;">
                <line x1="19" y1="12" x2="5" y2="12" />
                <polyline points="12 19 5 12 12 5" />
              </svg>
              Volver a Iniciar Sesión
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

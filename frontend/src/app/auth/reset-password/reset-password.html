<div class="auth-page">
  <div class="particles-container">
    <div class="particle" style="left: 20%; top: 10%; width: 3px; height: 3px; opacity: 0.3; animation-duration: 18s;"></div>
    <div class="particle" style="left: 60%; top: 40%; width: 2px; height: 2px; opacity: 0.2; animation-duration: 15s;"></div>
  </div>

  <div class="grid-bg"></div>

  <div class="auth-shell" style="max-width: 520px;">
    <div class="auth-form-side" style="padding: 2.5rem; min-height: 480px; width: 100%;">
      <div class="form-card" style="margin: 0 auto;">
        <!-- Logo -->
        <div class="form-logo" style="justify-content: center; margin-bottom: 2rem;">
          <div class="logo-mark"><span>R</span></div>
          <span class="logo-name">RealMyFit</span>
        </div>

        <h2 class="form-heading" style="text-align: center;">Nueva Contraseña</h2>
        <p class="form-subheading" style="text-align: center;">
          Ingresa el código que recibiste en tu correo y crea una nueva contraseña.
        </p>

        <!-- Success Alert -->
        <div *ngIf="successMessage" class="error-alert" style="background: rgba(46, 213, 115, 0.08); border-color: rgba(46, 213, 115, 0.2); color: #2ed573;">
          <div class="error-icon-wrap" style="background: rgba(46, 213, 115, 0.15);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <polyline points="20 6 9 17 4 12" />
            </svg>
          </div>
          <span>{{ successMessage }}<br><small>Redirigiendo al inicio de sesión...</small></span>
        </div>

        <!-- Error Alert -->
        <div *ngIf="errorMessage" class="error-alert">
          <div class="error-icon-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <circle cx="12" cy="12" r="10" />
              <line x1="15" y1="9" x2="9" y2="15" />
              <line x1="9" y1="9" x2="15" y2="15" />
            </svg>
          </div>
          <span>{{ errorMessage }}</span>
          <button class="error-dismiss" (click)="errorMessage = ''">✕</button>
        </div>

        <form (ngSubmit)="onSubmit()" [formGroup]="resetPasswordForm" class="auth-form" *ngIf="!successMessage">
          <!-- Code -->
          <div class="floating-field" style="margin-bottom: 1.5rem;">
            <div class="field-inner">
              <input type="text" id="code" formControlName="code" required maxlength="6" placeholder=" " style="text-align: center; font-size: 1.25rem; letter-spacing: 0.5em; font-weight: bold; text-transform: uppercase;">
              <label for="code" style="left: 50%; transform: translateX(-50%) translateY(-50%);">
                Código de 6 dígitos
              </label>
            </div>
          </div>

          <!-- New Password -->
          <div class="floating-field">
            <div class="field-inner">
              <input type="password" id="newPassword" formControlName="newPassword" required placeholder=" " minlength="6">
              <label for="newPassword">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                Nueva Contraseña
              </label>
            </div>
          </div>

          <!-- Password Strength Meter -->
          <div *ngIf="resetPasswordForm.get('newPassword')?.value" class="strength-meter">
            <div class="strength-bars">
              <div class="strength-bar" [class.active]="passwordStrength >= 1" [style.background]="passwordStrength >= 1 ? passwordStrengthColor : ''"></div>
              <div class="strength-bar" [class.active]="passwordStrength >= 2" [style.background]="passwordStrength >= 2 ? passwordStrengthColor : ''"></div>
              <div class="strength-bar" [class.active]="passwordStrength >= 3" [style.background]="passwordStrength >= 3 ? passwordStrengthColor : ''"></div>
              <div class="strength-bar" [class.active]="passwordStrength >= 4" [style.background]="passwordStrength >= 4 ? passwordStrengthColor : ''"></div>
              <div class="strength-bar" [class.active]="passwordStrength >= 5" [style.background]="passwordStrength >= 5 ? passwordStrengthColor : ''"></div>
            </div>
            <span class="strength-label" [style.color]="passwordStrengthColor">{{ passwordStrengthLabel }}</span>
          </div>

          <button type="submit" class="submit-btn" [disabled]="resetPasswordForm.invalid || loading" [class.loading]="loading" style="margin-top: 1.5rem;">
            <span class="btn-bg"></span>
            <span class="btn-content">
              <span *ngIf="loading" class="btn-spinner"></span>
              {{ loading ? 'Procesando...' : 'Restablecer Contraseña' }}
              <svg *ngIf="!loading" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </span>
          </button>
          
          <div class="mode-switch" style="margin-top: 2rem;">
            <button type="button" class="switch-btn" routerLink="/login">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right: 4px;">
                <line x1="19" y1="12" x2="5" y2="12" />
                <polyline points="12 19 5 12 12 5" />
              </svg>
              Cancelar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
